<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitTrack Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ============================================
       CSS VARIABLES & GLOBAL RESET
    ============================================ */
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #111118;
      --bg-card: #16161f;
      --bg-card-hover: #1c1c28;
      --border: #2a2a3a;
      --border-light: #333345;

      --accent-lime: #c8f542;
      --accent-lime-dim: rgba(200, 245, 66, 0.15);
      --accent-lime-glow: rgba(200, 245, 66, 0.3);
      --accent-orange: #ff6b35;
      --accent-blue: #4e9fff;
      --accent-purple: #9b72ff;
      --accent-red: #ff4757;
      --accent-teal: #2ed573;

      --text-primary: #f0f0f5;
      --text-secondary: #8888a0;
      --text-muted: #55556a;
      --text-accent: #c8f542;

      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;

      --shadow-card: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-glow: 0 0 40px rgba(200, 245, 66, 0.12);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);

      --navbar-h: 68px;
    }

    [data-theme="light"] {
      --bg-primary: #f5f5fa;
      --bg-secondary: #ebebf5;
      --bg-card: #ffffff;
      --bg-card-hover: #f8f8ff;
      --border: #e0e0ee;
      --border-light: #d0d0e5;
      --text-primary: #0a0a1a;
      --text-secondary: #555570;
      --text-muted: #9999b5;
      --accent-lime: #5a9e00;
      --accent-lime-dim: rgba(90, 158, 0, 0.1);
      --accent-lime-glow: rgba(90, 158, 0, 0.2);
      --text-accent: #4a8500;
      --shadow-card: 0 4px 24px rgba(0,0,0,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ============================================
       UTILITY CLASSES
    ============================================ */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .gap-4 { gap: 16px; }
    .gap-6 { gap: 24px; }
    .gap-8 { gap: 32px; }
    .text-center { text-align: center; }
    .w-full { width: 100%; }
    .relative { position: relative; }
    .overflow-hidden { overflow: hidden; }

    /* ============================================
       NAVBAR
    ============================================ */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--navbar-h);
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      display: flex;
      align-items: center;
      transition: var(--transition);
    }

    [data-theme="light"] .navbar {
      background: rgba(245, 245, 250, 0.88);
    }

    .navbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--accent-lime);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: var(--transition);
    }

    .logo:hover .logo-icon { transform: rotate(-10deg) scale(1.1); }

    .logo-text {
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: 1px;
      color: var(--text-primary);
    }

    .logo-text span { color: var(--accent-lime); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
    }

    .nav-link {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .nav-link:hover { color: var(--text-primary); background: var(--bg-card); }
    .nav-link.active { color: var(--accent-lime); background: var(--accent-lime-dim); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: var(--transition);
    }

    .theme-toggle:hover { color: var(--accent-lime); border-color: var(--accent-lime); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: var(--transition);
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent-lime);
      color: #0a0a0f;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px var(--accent-lime-glow);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-outline:hover { border-color: var(--accent-lime); color: var(--accent-lime); background: var(--accent-lime-dim); }

    .btn-ghost {
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { color: var(--text-primary); border-color: var(--border-light); }

    .btn-danger { background: var(--accent-red); color: #fff; }
    .btn-danger:hover { opacity: 0.85; transform: translateY(-1px); }

    .btn-sm { padding: 7px 14px; font-size: 13px; }
    .btn-lg { padding: 14px 32px; font-size: 16px; border-radius: var(--radius-md); }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
    }

    .hamburger span {
      width: 20px;
      height: 2px;
      background: var(--text-secondary);
      border-radius: 2px;
      transition: var(--transition);
    }

    /* ============================================
       PAGE LAYOUT
    ============================================ */
    .page {
      padding-top: var(--navbar-h);
      min-height: 100vh;
    }

    /* ============================================
       HOME PAGE
    ============================================ */
    .hero {
      min-height: calc(100vh - var(--navbar-h));
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      text-align: center;
      padding: 60px 24px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .hero-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: float 8s ease-in-out infinite;
    }

    .hero-orb-1 {
      width: 500px; height: 500px;
      background: var(--accent-lime);
      top: -200px; right: -100px;
      animation-delay: 0s;
    }

    .hero-orb-2 {
      width: 400px; height: 400px;
      background: var(--accent-orange);
      bottom: -150px; left: -50px;
      animation-delay: -3s;
    }

    .hero-orb-3 {
      width: 300px; height: 300px;
      background: var(--accent-purple);
      top: 40%; left: 40%;
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 100px;
      border: 1px solid var(--border-light);
      background: var(--bg-card);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      margin-bottom: 24px;
      animation: fadeInUp 0.6s ease both;
    }

    .hero-badge .dot {
      width: 7px; height: 7px;
      background: var(--accent-lime);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(64px, 10vw, 130px);
      line-height: 0.95;
      letter-spacing: 2px;
      color: var(--text-primary);
      margin-bottom: 6px;
      animation: fadeInUp 0.6s ease 0.1s both;
    }

    .hero-title .highlight {
      color: var(--accent-lime);
      display: block;
    }

    .hero-subtitle {
      font-size: clamp(16px, 2.5vw, 20px);
      color: var(--text-secondary);
      max-width: 560px;
      margin: 20px auto 40px;
      line-height: 1.6;
      animation: fadeInUp 0.6s ease 0.2s both;
    }

    .hero-cta {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeInUp 0.6s ease 0.3s both;
    }

    .hero-stats {
      display: flex;
      gap: 40px;
      margin-top: 80px;
      animation: fadeInUp 0.6s ease 0.4s both;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hero-stat {
      text-align: center;
    }

    .hero-stat-num {
      font-family: var(--font-display);
      font-size: 42px;
      color: var(--accent-lime);
      line-height: 1;
    }

    .hero-stat-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Features section */
    .section {
      padding: 80px 24px;
    }

    .section-label {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--accent-lime);
      background: var(--accent-lime-dim);
      padding: 5px 12px;
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(36px, 5vw, 60px);
      letter-spacing: 1px;
      line-height: 1.05;
      color: var(--text-primary);
      margin-bottom: 14px;
    }

    .section-desc {
      font-size: 16px;
      color: var(--text-secondary);
      max-width: 500px;
      line-height: 1.65;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 50px;
    }

    .feature-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      transition: var(--transition);
      cursor: default;
    }

    .feature-card:hover {
      border-color: var(--border-light);
      background: var(--bg-card-hover);
      transform: translateY(-4px);
      box-shadow: var(--shadow-card);
    }

    .feature-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 18px;
    }

    .feature-card h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .feature-card p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* How it works */
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 50px;
    }

    .step-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      position: relative;
      transition: var(--transition);
    }

    .step-card:hover { border-color: var(--accent-lime); box-shadow: var(--shadow-glow); }

    .step-num {
      font-family: var(--font-display);
      font-size: 52px;
      color: var(--accent-lime);
      opacity: 0.3;
      line-height: 1;
      margin-bottom: 12px;
    }

    .step-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .step-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

    /* CTA Banner */
    .cta-banner {
      background: var(--accent-lime);
      border-radius: var(--radius-xl);
      padding: 56px 48px;
      text-align: center;
      margin: 0 24px 80px;
      position: relative;
      overflow: hidden;
    }

    .cta-banner::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -30%;
      width: 400px;
      height: 400px;
      background: rgba(0,0,0,0.08);
      border-radius: 50%;
    }

    .cta-banner h2 {
      font-family: var(--font-display);
      font-size: clamp(32px, 5vw, 56px);
      color: #0a0a0f;
      margin-bottom: 12px;
      position: relative;
    }

    .cta-banner p {
      font-size: 16px;
      color: rgba(0,0,0,0.65);
      margin-bottom: 28px;
      position: relative;
    }

    .cta-banner .btn {
      background: #0a0a0f;
      color: var(--accent-lime);
      position: relative;
    }

    .cta-banner .btn:hover { background: #1a1a2a; transform: translateY(-2px); }

    /* ============================================
       DASHBOARD
    ============================================ */
    .dashboard {
      padding: 32px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 32px;
    }

    .page-header h1 {
      font-family: var(--font-display);
      font-size: clamp(32px, 4vw, 48px);
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .page-header p {
      color: var(--text-secondary);
      margin-top: 6px;
      font-size: 15px;
    }

    .greeting-name { color: var(--accent-lime); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      transition: var(--transition);
      cursor: default;
    }

    .stat-card:hover { border-color: var(--border-light); transform: translateY(-2px); box-shadow: var(--shadow-card); }

    .stat-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-icon {
      width: 34px; height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: 36px;
      letter-spacing: 1px;
      line-height: 1;
    }

    .stat-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .stat-change {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 100px;
    }

    .stat-change.up { color: var(--accent-teal); background: rgba(46, 213, 115, 0.12); }
    .stat-change.down { color: var(--accent-red); background: rgba(255, 71, 87, 0.12); }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      transition: var(--transition);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .progress-ring {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 16px 0;
    }

    .ring-wrap { position: relative; flex-shrink: 0; }

    .ring-label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .ring-pct {
      font-family: var(--font-display);
      font-size: 24px;
      line-height: 1;
      color: var(--text-primary);
    }

    .ring-desc { font-size: 10px; color: var(--text-muted); }

    .ring-info h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .ring-info p { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    /* Activity list */
    .activity-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

    .activity-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-secondary);
      transition: var(--transition);
    }

    .activity-item:hover { background: var(--bg-card-hover); }

    .activity-icon {
      width: 36px; height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .activity-info { flex: 1; min-width: 0; }
    .activity-name { font-size: 13px; font-weight: 600; }
    .activity-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .activity-cal { font-family: var(--font-mono); font-size: 12px; color: var(--accent-lime); font-weight: 600; }

    /* Water tracker */
    .water-tracker { display: flex; flex-direction: column; gap: 12px; }
    .water-cups { display: flex; gap: 8px; flex-wrap: wrap; }

    .water-cup {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: var(--transition);
      color: var(--text-muted);
    }

    .water-cup.filled {
      background: rgba(78, 159, 255, 0.2);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .water-cup:hover { border-color: var(--accent-blue); }

    .water-info { display: flex; justify-content: space-between; align-items: center; }
    .water-val { font-family: var(--font-display); font-size: 28px; color: var(--accent-blue); }
    .water-goal { font-size: 12px; color: var(--text-muted); }

    /* Progress bar */
    .progress-bar-wrap { margin: 8px 0; }
    .progress-bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }

    .progress-bar {
      height: 6px;
      background: var(--bg-secondary);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ============================================
       WORKOUT TRACKER
    ============================================ */
    .workout-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      align-items: start;
    }

    .workout-form-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      position: sticky;
      top: calc(var(--navbar-h) + 20px);
    }

    .form-group { margin-bottom: 16px; }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      transition: var(--transition);
      outline: none;
    }

    .form-control:focus { border-color: var(--accent-lime); box-shadow: 0 0 0 3px var(--accent-lime-dim); }
    .form-control::placeholder { color: var(--text-muted); }

    select.form-control { cursor: pointer; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Workout type chips */
    .type-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }

    .type-chip {
      padding: 6px 14px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .type-chip:hover { border-color: var(--accent-lime); color: var(--accent-lime); }
    .type-chip.selected { background: var(--accent-lime-dim); border-color: var(--accent-lime); color: var(--accent-lime); }

    /* Workout list */
    .workouts-list { display: flex; flex-direction: column; gap: 12px; }

    .workout-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: var(--transition);
      cursor: default;
    }

    .workout-card:hover { border-color: var(--border-light); background: var(--bg-card-hover); }

    .workout-type-icon {
      width: 46px; height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .workout-info { flex: 1; min-width: 0; }
    .workout-name { font-size: 15px; font-weight: 600; }
    .workout-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; display: flex; gap: 12px; }
    .workout-meta span { display: flex; align-items: center; gap: 4px; }

    .workout-stats { display: flex; gap: 16px; text-align: center; }

    .w-stat-val {
      font-family: var(--font-display);
      font-size: 20px;
      line-height: 1;
    }

    .w-stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

    .workout-actions { display: flex; gap: 8px; }

    /* Filter bar */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-input-wrap { position: relative; flex: 1; min-width: 200px; }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus { border-color: var(--accent-lime); }
    .search-input::placeholder { color: var(--text-muted); }

    /* ============================================
       NUTRITION TRACKER
    ============================================ */
    .nutrition-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      align-items: start;
    }

    .macro-ring-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .macro-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      text-align: center;
      transition: var(--transition);
    }

    .macro-card:hover { transform: translateY(-2px); }

    .macro-value {
      font-family: var(--font-display);
      font-size: 28px;
      line-height: 1;
      margin: 8px 0 4px;
    }

    .macro-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .macro-unit { font-size: 11px; color: var(--text-muted); }

    .meals-list { display: flex; flex-direction: column; gap: 10px; }

    .meal-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: var(--transition);
    }

    .meal-item:hover { border-color: var(--border-light); }

    .meal-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .meal-info { flex: 1; }
    .meal-name { font-size: 14px; font-weight: 600; }
    .meal-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .meal-macros { display: flex; gap: 10px; align-items: center; }

    .meal-macro-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 100px;
    }

    .meal-cal {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-orange);
    }

    /* Calorie gauge */
    .calorie-gauge-wrap {
      text-align: center;
      padding: 16px 0;
    }

    .calorie-gauge-num {
      font-family: var(--font-display);
      font-size: 52px;
      color: var(--text-primary);
      line-height: 1;
    }

    .calorie-gauge-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .calorie-gauge-remaining { font-size: 14px; color: var(--accent-lime); font-weight: 600; margin-top: 8px; }

    /* ============================================
       PROGRESS / ANALYTICS
    ============================================ */
    .analytics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .chart-wrap { position: relative; height: 220px; }

    .achievement-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .achievement-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      transition: var(--transition);
    }

    .achievement-card.unlocked {
      border-color: var(--accent-lime);
      background: var(--accent-lime-dim);
    }

    .achievement-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-card); }

    .achievement-icon { font-size: 28px; margin-bottom: 8px; display: block; }
    .achievement-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .achievement-desc { font-size: 11px; color: var(--text-muted); }

    .locked-overlay {
      opacity: 0.4;
      filter: grayscale(1);
    }

    /* AI Suggestions */
    .ai-suggestions { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }

    .ai-suggestion-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      gap: 14px;
      transition: var(--transition);
    }

    .ai-suggestion-card:hover { border-color: var(--accent-purple); background: rgba(155, 114, 255, 0.05); }

    .ai-icon {
      width: 36px; height: 36px;
      border-radius: 9px;
      background: rgba(155, 114, 255, 0.15);
      border: 1px solid rgba(155, 114, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .ai-suggestion-text h4 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .ai-suggestion-text p { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    /* Challenges */
    .challenge-list { display: flex; flex-direction: column; gap: 12px; }

    .challenge-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      transition: var(--transition);
    }

    .challenge-card:hover { border-color: var(--accent-orange); }

    .challenge-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .challenge-icon { font-size: 24px; }
    .challenge-title { font-size: 14px; font-weight: 600; }
    .challenge-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .challenge-reward { margin-left: auto; font-size: 12px; color: var(--accent-orange); font-weight: 600; }

    /* ============================================
       LOGIN / REGISTER
    ============================================ */
    .auth-page {
      min-height: calc(100vh - var(--navbar-h));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
    }

    .auth-bg-text {
      position: absolute;
      font-family: var(--font-display);
      font-size: 260px;
      color: var(--bg-card);
      user-select: none;
      pointer-events: none;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      letter-spacing: 8px;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-title {
      font-family: var(--font-display);
      font-size: 32px;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 24px;
    }

    .auth-tab {
      padding: 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: var(--transition);
      color: var(--text-muted);
      border: none;
      background: transparent;
    }

    .auth-tab.active {
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .social-btn {
      width: 100%;
      padding: 11px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition);
      margin-bottom: 10px;
    }

    .social-btn:hover { border-color: var(--border-light); background: var(--bg-card-hover); }

    .auth-footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 20px;
    }

    .auth-footer a {
      color: var(--accent-lime);
      cursor: pointer;
      font-weight: 500;
    }

    /* ============================================
       NOTIFICATION TOAST
    ============================================ */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 280px;
      max-width: 380px;
      pointer-events: all;
      box-shadow: var(--shadow-card);
      animation: slideInToast 0.3s ease;
    }

    .toast.success { border-left: 3px solid var(--accent-teal); }
    .toast.error { border-left: 3px solid var(--accent-red); }
    .toast.info { border-left: 3px solid var(--accent-blue); }

    .toast-icon { font-size: 18px; flex-shrink: 0; }
    .toast-text { flex: 1; }
    .toast-title { font-size: 13px; font-weight: 600; }
    .toast-msg { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    @keyframes slideInToast {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ============================================
       MOBILE NAV DRAWER
    ============================================ */
    .mobile-nav {
      position: fixed;
      top: var(--navbar-h);
      left: 0; right: 0;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transform: translateY(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .mobile-nav.open {
      transform: translateY(0);
      pointer-events: all;
    }

    .mobile-nav-link {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .mobile-nav-link:hover { color: var(--text-primary); background: var(--bg-secondary); }
    .mobile-nav-link.active { color: var(--accent-lime); background: var(--accent-lime-dim); }

    /* ============================================
       FOOTER
    ============================================ */
    .footer {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 48px 24px 32px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 40px;
    }

    .footer-brand p {
      font-size: 14px;
      color: var(--text-secondary);
      margin: 12px 0 20px;
      line-height: 1.65;
      max-width: 280px;
    }

    .footer-social { display: flex; gap: 10px; }

    .social-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-secondary);
    }

    .social-icon:hover { border-color: var(--accent-lime); color: var(--accent-lime); }

    .footer-col h4 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-primary);
      margin-bottom: 14px;
    }

    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 9px; }
    .footer-col li { font-size: 14px; color: var(--text-secondary); cursor: pointer; transition: var(--transition); }
    .footer-col li:hover { color: var(--accent-lime); }

    .footer-bottom {
      max-width: 1200px;
      margin: 32px auto 0;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-bottom p { font-size: 13px; color: var(--text-muted); }

    /* ============================================
       EMPTY STATE
    ============================================ */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
    }

    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .empty-desc { font-size: 14px; color: var(--text-secondary); }

    /* ============================================
       TABS
    ============================================ */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 20px;
      width: fit-content;
    }

    .tab {
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-muted);
      border: none;
      background: transparent;
    }

    .tab.active { background: var(--bg-card); color: var(--text-primary); box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    .tab:hover:not(.active) { color: var(--text-secondary); }

    /* ============================================
       BADGE
    ============================================ */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge-green { background: rgba(46, 213, 115, 0.15); color: var(--accent-teal); }
    .badge-orange { background: rgba(255, 107, 53, 0.15); color: var(--accent-orange); }
    .badge-blue { background: rgba(78, 159, 255, 0.15); color: var(--accent-blue); }
    .badge-purple { background: rgba(155, 114, 255, 0.15); color: var(--accent-purple); }
    .badge-lime { background: var(--accent-lime-dim); color: var(--text-accent); }

    /* ============================================
       DIVIDER
    ============================================ */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* ============================================
       RESPONSIVE
    ============================================ */
    @media (max-width: 900px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .workout-grid { grid-template-columns: 1fr; }
      .nutrition-grid { grid-template-columns: 1fr; }
      .analytics-grid { grid-template-columns: 1fr; }
      .footer-inner { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 720px) {
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .hero-title { font-size: 64px; }
      .hero-stats { gap: 24px; }
    }

    @media (max-width: 520px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .macro-ring-grid { grid-template-columns: 1fr 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .footer-inner { grid-template-columns: 1fr; }
      .auth-card { padding: 28px 20px; }
    }

    /* ============================================
       MISC
    ============================================ */
    .tag {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
    }

    .loading-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--accent-lime);
      border-radius: 50%;
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; } 50% { opacity: 0.2; }
    }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent-lime);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #0a0a0f;
      flex-shrink: 0;
    }

    .streak-flame {
      font-size: 18px;
      animation: flicker 1.5s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      from { transform: scale(1) rotate(-3deg); }
      to { transform: scale(1.15) rotate(3deg); }
    }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(155, 114, 255, 0.15);
      border: 1px solid rgba(155, 114, 255, 0.3);
      color: var(--accent-purple);
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dot-separator {
      width: 3px; height: 3px;
      background: var(--text-muted);
      border-radius: 50%;
    }

    /* Skeleton loader */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Notification bell */
    .notif-btn {
      position: relative;
      width: 38px; height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: var(--transition);
    }

    .notif-btn:hover { color: var(--text-primary); border-color: var(--border-light); }

    .notif-dot {
      position: absolute;
      top: 7px; right: 7px;

    function useLocalStorage(key, initial) {
      const [val, setVal] = useState(() => {
        try {
          const stored = localStorage.getItem(key);
          return stored ? JSON.parse(stored) : initial;
        } catch { return initial; }
      });

      const setStored = useCallback((v) => {
        const next = typeof v === 'function' ? v(val) : v;
        setVal(next);
        try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      }, [key, val]);

      return [val, setStored];
    }

    function ToastContainer({ toasts, remove }) {

              <div className="toast-text">

            </div>
          ))}
        </div>
      );
    }

    function useToasts() {
      const [toasts, setToasts] = useState([]);

      const add = useCallback((type, title, msg) => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, type, title, msg }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      }, []);

      const remove = useCallback((id) => setToasts(prev => prev.filter(t => t.id !== id)), []);

      return { toasts, add, remove };
    }

    function CircularProgress({ pct, size = 80, stroke = 6, color = 'var(--accent-lime)', children }) {
      const r = (size - stroke) / 2;
      const circ = 2 * Math.PI * r;
      const offset = circ - (pct / 100) * circ;
      return (
        <div className="ring-wrap" style={{ width: size, height: size }}>
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bg-secondary)" strokeWidth={stroke} />
            <circle
              cx={size/2} cy={size/2} r={r}
              fill="none" stroke={color} strokeWidth={stroke}
              strokeDasharray={circ}
              strokeDashoffset={offset}
              strokeLinecap="round"
              transform={`rotate(-90 ${size/2} ${size/2})`}
              style={{ transition: 'stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1)' }}
            />
          </svg>
          <div className="ring-label">{children}</div>
        </div>
      );
    }

                  <span className="stat-change up">↑ Active</span>

            {/* Main grid */}
            <div className="dashboard-grid">
              {/* Weekly calories chart */}

                <div className="card-header">
                  <div>
