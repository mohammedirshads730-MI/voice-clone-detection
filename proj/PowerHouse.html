    /* ============================================
       WORKOUT TRACKER
    ============================================ */
    function WorkoutsPage({ workouts, setWorkouts, addToast }) {
      const [form, setForm] = useState({ name: '', type: 'cardio', duration: '', calories: '', notes: '', date: new Date().toISOString().split('T')[0] });
      const [search, setSearch] = useState('');
      const [filterType, setFilterType] = useState('all');
      const [editId, setEditId] = useState(null);

      const filtered = workouts.filter(w => {
        const matchSearch = w.name.toLowerCase().includes(search.toLowerCase());
        const matchType = filterType === 'all' || w.type === filterType;
        return matchSearch && matchType;
      });

      const handleSubmit = () => {
        if (!form.name || !form.duration || !form.calories) {
          addToast('error', 'Missing fields', 'Please fill in workout name, duration, and calories.');
          return;
        }
        if (editId) {
          setWorkouts(prev => prev.map(w => w.id === editId ? { ...form, id: editId } : w));
          addToast('success', '✏️ Workout updated', `"${form.name}" has been updated.`);
          setEditId(null);
        } else {
          const newW = { ...form, id: Date.now() };
          setWorkouts(prev => [newW, ...prev]);
          addToast('success', '💪 Workout logged!', `"${form.name}" — ${form.calories} kcal burned.`);
        }
        setForm({ name: '', type: 'cardio', duration: '', calories: '', notes: '', date: new Date().toISOString().split('T')[0] });
      };

      const handleEdit = (w) => {
        setForm({ name: w.name, type: w.type, duration: w.duration, calories: w.calories, notes: w.notes || '', date: w.date });
        setEditId(w.id);
      };

      const handleDelete = (id, name) => {
        setWorkouts(prev => prev.filter(w => w.id !== id));
        addToast('info', '🗑️ Deleted', `"${name}" removed.`);
        if (editId === id) { setEditId(null); setForm({ name: '', type: 'cardio', duration: '', calories: '', notes: '', date: new Date().toISOString().split('T')[0] }); }
      };

      const typeInfo = (type) => WORKOUT_TYPES.find(t => t.key === type) || WORKOUT_TYPES[0];

      return (
        <div className="page">
          <div className="dashboard">
            <div className="page-header">
              <h1>Workout <span style={{color:'var(--accent-lime)'}}>Tracker</span></h1>
              <p>Log and manage all your training sessions.</p>
            </div>

            <div className="workout-grid">
              {/* Workout list */}
              <div>
                <div className="filter-bar">
                  <div className="search-input-wrap">
                    <span className="search-icon">🔍</span>
                    <input className="search-input" placeholder="Search workouts..."
                      value={search} onChange={e => setSearch(e.target.value)} />
                  </div>
                  <select className="form-control" style={{width:'auto',flexShrink:0}}
                    value={filterType} onChange={e => setFilterType(e.target.value)}>
                    <option value="all">All Types</option>
                    {WORKOUT_TYPES.map(t => <option key={t.key} value={t.key}>{t.label}</option>)}
                  </select>
                </div>

                {filtered.length === 0 ? (
                  <div className="empty-state" style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)'}}>
                    <div className="empty-icon">🏃</div>
                    <div className="empty-title">{search || filterType !== 'all' ? 'No matches found' : 'No workouts yet'}</div>
                    <div className="empty-desc">Use the form to add your first workout!</div>
                  </div>
                ) : (
                  <div className="workouts-list">
                    {filtered.map(w => {
                      const ti = typeInfo(w.type);
                      return (
                        <div key={w.id} className="workout-card">
                          <div className={`workout-type-icon icon-bg-${ti.color}`}>{ti.icon}</div>
                          <div className="workout-info">
                            <div className="workout-name">{w.name}</div>
                            <div className="workout-meta">
                              <span className={`tag tag-${w.type}`}>{ti.label}</span>
                              <span>📅 {new Date(w.date).toLocaleDateString()}</span>
                            </div>
                            {w.notes && <div style={{fontSize:12,color:'var(--text-muted)',marginTop:4}}>{w.notes}</div>}
                          </div>
                          <div className="workout-stats">
                            <div>
                              <div className="w-stat-val c-blue">{w.duration}</div>
                              <div className="w-stat-label">min</div>
                            </div>
                            <div>
                              <div className="w-stat-val c-lime">{w.calories}</div>
                              <div className="w-stat-label">kcal</div>
                            </div>
                          </div>
                          <div className="workout-actions">
                            <button className="btn btn-ghost btn-sm" onClick={() => handleEdit(w)}>✏️</button>
                            <button className="btn btn-ghost btn-sm" style={{color:'var(--accent-red)'}} onClick={() => handleDelete(w.id, w.name)}>🗑️</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* Form */}
              <div className="workout-form-card">
                <div className="card-header" style={{marginBottom:20}}>
                  <div>
                    <div className="card-title">{editId ? '✏️ Edit Workout' : '+ Log Workout'}</div>
                    <div className="card-subtitle">Fill in the details below</div>
                  </div>
                  {editId && (
                    <button className="btn btn-ghost btn-sm" onClick={() => { setEditId(null); setForm({ name:'',type:'cardio',duration:'',calories:'',notes:'',date:new Date().toISOString().split('T')[0] }); }}>
                      ✕ Cancel
                    </button>
                  )}
                </div>

                <div className="form-group">
                  <label className="form-label">Workout Type</label>
                  <div className="type-chips">
                    {WORKOUT_TYPES.map(t => (
                      <button key={t.key} className={`type-chip ${form.type === t.key ? 'selected' : ''}`}
                        onClick={() => setForm(f => ({ ...f, type: t.key }))}>
                        {t.icon} {t.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="form-group">
                  <label className="form-label">Exercise Name</label>
                  <input className="form-control" placeholder="e.g. Morning Run, Push Day..."
                    value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} />
                </div>

                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Duration (min)</label>
                    <input className="form-control" type="number" placeholder="45"
                      value={form.duration} onChange={e => setForm(f => ({ ...f, duration: e.target.value }))} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Calories (kcal)</label>
                    <input className="form-control" type="number" placeholder="320"
                      value={form.calories} onChange={e => setForm(f => ({ ...f, calories: e.target.value }))} />
                  </div>
                </div>

                <div className="form-group">
                  <label className="form-label">Date</label>
                  <input className="form-control" type="date"
                    value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))} />
                </div>

                <div className="form-group">
                  <label className="form-label">Notes (optional)</label>
                  <textarea className="form-control" rows={3} placeholder="How did it go?"
                    value={form.notes} onChange={e => setForm(f => ({ ...f, notes: e.target.value }))}
                    style={{resize:'vertical'}} />
                </div>

                <button className="btn btn-primary w-full" onClick={handleSubmit}>
                  {editId ? '✅ Save Changes' : '💪 Log Workout'}
                </button>

                {/* Quick tips */}
                <div className="divider" />
                <div style={{background:'var(--bg-secondary)',borderRadius:'var(--radius-sm)',padding:'14px'}}>
                  <div style={{fontSize:11,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:8}}>💡 Quick Tips</div>
                  <div style={{fontSize:12,color:'var(--text-secondary)',lineHeight:1.6}}>
                    • Aim for 150 min moderate cardio/week<br/>
                    • Include strength training 2x/week<br/>
                    • Rest days are equally important!
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ============================================
       NUTRITION TRACKER
    ============================================ */
    function NutritionPage({ meals, setMeals, addToast }) {
      const [form, setForm] = useState({ name: '', mealType: 'breakfast', calories: '', protein: '', carbs: '', fat: '', time: '' });
      const [tab, setTab] = useState('log');

      const totalCal = meals.reduce((s, m) => s + parseInt(m.calories || 0), 0);
      const totalProtein = meals.reduce((s, m) => s + parseInt(m.protein || 0), 0);
      const totalCarbs = meals.reduce((s, m) => s + parseInt(m.carbs || 0), 0);
      const totalFat = meals.reduce((s, m) => s + parseInt(m.fat || 0), 0);
      const calGoal = 2000;
      const remaining = calGoal - totalCal;

      const handleAddMeal = () => {
        if (!form.name || !form.calories) {
          addToast('error', 'Missing fields', 'Please enter meal name and calories.');
          return;
        }
        const newM = { ...form, id: Date.now(), time: form.time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
        setMeals(prev => [newM, ...prev]);
        addToast('success', '🥗 Meal logged!', `"${form.name}" — ${form.calories} kcal`);
        setForm({ name: '', mealType: 'breakfast', calories: '', protein: '', carbs: '', fat: '', time: '' });
      };

      const handleDelete = (id, name) => {
        setMeals(prev => prev.filter(m => m.id !== id));
        addToast('info', '🗑️ Removed', `"${name}" removed.`);
      };

      return (
        <div className="page">
          <div className="dashboard">
            <div className="page-header">
              <h1>Nutrition <span style={{color:'var(--accent-orange)'}}>Tracker</span></h1>
              <p>Monitor your daily food intake and macronutrients.</p>
            </div>

            {/* Macro overview */}
            <div className="macro-ring-grid">
              {[
                { label: 'Calories', val: totalCal, max: calGoal, unit: 'kcal', color: 'var(--accent-orange)' },
                { label: 'Protein', val: totalProtein, max: 150, unit: 'g', color: 'var(--accent-blue)' },
                { label: 'Carbs', val: totalCarbs, max: 250, unit: 'g', color: 'var(--accent-lime)' },
                { label: 'Fat', val: totalFat, max: 65, unit: 'g', color: 'var(--accent-purple)' },
              ].map(m => (
                <div key={m.label} className="macro-card">
                  <div className="macro-label">{m.label}</div>
                  <div className="macro-value" style={{color:m.color}}>{m.val}</div>
                  <div className="macro-unit">/ {m.max} {m.unit}</div>
                  <div className="progress-bar" style={{marginTop:10}}>
                    <div className="progress-bar-fill" style={{width:`${Math.min(100,m.val/m.max*100)}%`,background:m.color}} />
                  </div>
                </div>
              ))}
            </div>

            <div className="nutrition-grid">
              {/* Left: meal log */}
              <div>
                <div className="tabs">
                  <button className={`tab ${tab==='log'?'active':''}`} onClick={() => setTab('log')}>Meal Log</button>
                  <button className={`tab ${tab==='chart'?'active':''}`} onClick={() => setTab('chart')}>Weekly Chart</button>
                </div>

                {tab === 'log' ? (
                  <div className="meals-list">
                    {meals.length === 0 ? (
                      <div className="empty-state" style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)'}}>
                        <div className="empty-icon">🍽️</div>
                        <div className="empty-title">No meals logged yet</div>
                        <div className="empty-desc">Add your first meal using the form!</div>
                      </div>
                    ) : meals.map(m => (
                      <div key={m.id} className="meal-item">
                        <div className={`meal-icon icon-bg-orange`}>{MEAL_ICONS[m.mealType] || '🍽️'}</div>
                        <div className="meal-info">
                          <div className="meal-name">{m.name}</div>
                          <div className="meal-time">{m.mealType.charAt(0).toUpperCase()+m.mealType.slice(1)} · {m.time}</div>
                        </div>
                        <div className="meal-macros">
                          {m.protein && <span className="meal-macro-badge" style={{background:'rgba(78,159,255,0.15)',color:'var(--accent-blue)'}}>P:{m.protein}g</span>}
                          {m.carbs && <span className="meal-macro-badge" style={{background:'var(--accent-lime-dim)',color:'var(--text-accent)'}}>C:{m.carbs}g</span>}
                          {m.fat && <span className="meal-macro-badge" style={{background:'rgba(155,114,255,0.15)',color:'var(--accent-purple)'}}>F:{m.fat}g</span>}
                          <span className="meal-cal">{m.calories} kcal</span>
                        </div>
                        <button className="btn btn-ghost btn-sm" style={{color:'var(--accent-red)',flexShrink:0}} onClick={() => handleDelete(m.id, m.name)}>🗑️</button>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="chart-card">
                    <div className="card-header">
                      <div className="card-title">Weekly Calorie Trend</div>
                    </div>
                    <div className="chart-wrap">
                      <CalorieLineChart meals={meals} />
                    </div>
                  </div>
                )}
              </div>

              {/* Right: form + donut */}
              <div style={{display:'flex',flexDirection:'column',gap:20}}>
                {/* Calorie gauge */}
                <div className="card">
                  <div className="card-title" style={{marginBottom:16}}>Today's Calorie Budget</div>
                  <div className="calorie-gauge-wrap">
                    <CircularProgress pct={Math.min(100,Math.round(totalCal/calGoal*100))} size={120} stroke={8} color={remaining > 0 ? 'var(--accent-orange)' : 'var(--accent-red)'}>
                      <div className="calorie-gauge-num">{totalCal}</div>
                      <div className="calorie-gauge-label">kcal</div>
                    </CircularProgress>
                    <div className="calorie-gauge-remaining" style={{color: remaining > 0 ? 'var(--accent-lime)' : 'var(--accent-red)'}}>
                      {remaining > 0 ? `${remaining} kcal remaining` : `${Math.abs(remaining)} kcal over budget`}
                    </div>
                  </div>
                </div>

                {/* Macro donut */}
                <div className="card">
                  <div className="card-title" style={{marginBottom:16}}>Macro Distribution</div>
                  <div className="chart-wrap" style={{height:180}}>
                    <MacroDonutChart carbs={totalCarbs} protein={totalProtein} fat={totalFat} />
                  </div>
                </div>

                {/* Add meal form */}
                <div className="card">
                  <div className="card-title" style={{marginBottom:16}}>+ Log Meal</div>

                  <div className="form-group">
                    <label className="form-label">Meal Type</label>
                    <select className="form-control" value={form.mealType} onChange={e => setForm(f=>({...f,mealType:e.target.value}))}>
                      <option value="breakfast">🌅 Breakfast</option>
                      <option value="lunch">☀️ Lunch</option>
                      <option value="dinner">🌙 Dinner</option>
                      <option value="snack">🍎 Snack</option>
                    </select>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Food Name</label>
                    <input className="form-control" placeholder="e.g. Grilled Chicken & Rice"
                      value={form.name} onChange={e => setForm(f=>({...f,name:e.target.value}))} />
                  </div>

                  <div className="form-row">
                    <div className="form-group">
                      <label className="form-label">Calories</label>
                      <input className="form-control" type="number" placeholder="450"
                        value={form.calories} onChange={e => setForm(f=>({...f,calories:e.target.value}))} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Protein (g)</label>
                      <input className="form-control" type="number" placeholder="35"
                        value={form.protein} onChange={e => setForm(f=>({...f,protein:e.target.value}))} />
                    </div>
                  </div>

                  <div className="form-row">
                    <div className="form-group">
                      <label className="form-label">Carbs (g)</label>
                      <input className="form-control" type="number" placeholder="60"
                        value={form.carbs} onChange={e => setForm(f=>({...f,carbs:e.target.value}))} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Fat (g)</label>
                      <input className="form-control" type="number" placeholder="12"
                        value={form.fat} onChange={e => setForm(f=>({...f,fat:e.target.value}))} />
                    </div>
                  </div>

                  <button className="btn btn-primary w-full" onClick={handleAddMeal}>🥗 Add Meal</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ============================================
       PROGRESS / ANALYTICS
    ============================================ */
    function ProgressPage({ workouts, meals }) {
      const [tab, setTab] = useState('overview');

      const totalWorkouts = workouts.length;
      const totalCalBurned = workouts.reduce((s,w) => s + parseInt(w.calories||0), 0);
      const avgDuration = totalWorkouts ? Math.round(workouts.reduce((s,w) => s+parseInt(w.duration||0),0)/totalWorkouts) : 0;

      const typeBreakdown = WORKOUT_TYPES.map(t => ({
        ...t,
        count: workouts.filter(w => w.type === t.key).length,
      })).filter(t => t.count > 0).sort((a,b) => b.count - a.count);

      return (
        <div className="page">
          <div className="dashboard">
            <div className="page-header">
              <h1>Progress <span style={{color:'var(--accent-purple)'}}>Analytics</span></h1>
              <p>A complete picture of your fitness journey.</p>
            </div>

            <div className="tabs">
              {['overview','achievements','challenges','ai'].map(t => (
                <button key={t} className={`tab ${tab===t?'active':''}`} onClick={() => setTab(t)}>
                  {t === 'overview' ? '📊 Overview' : t === 'achievements' ? '🏆 Badges' : t === 'challenges' ? '⚡ Challenges' : '🤖 AI Coach'}
                </button>
              ))}
            </div>

            {tab === 'overview' && (
              <>
                {/* Summary stats */}
                <div className="stats-grid" style={{marginBottom:24}}>
                  {[
                    { label: 'Total Workouts', val: totalWorkouts, icon: '🏋️', color: 'c-blue' },
                    { label: 'Calories Burned', val: totalCalBurned, icon: '🔥', color: 'c-lime' },
                    { label: 'Avg Duration', val: `${avgDuration}m`, icon: '⏱️', color: 'c-purple' },
                    { label: 'Current Streak', val: '7 days', icon: '🔥', color: 'c-orange' },
                  ].map(s => (
                    <div key={s.label} className="stat-card">
                      <div className="stat-card-header">
                        <span className="stat-label">{s.label}</span>
                        <span style={{fontSize:20}}>{s.icon}</span>
                      </div>
                      <div className={`stat-value ${s.color}`}>{s.val}</div>
                    </div>
                  ))}
                </div>

                <div className="analytics-grid">
                  {/* Weight chart */}
                  <div className="chart-card">
                    <div className="card-header" style={{marginBottom:16}}>
                      <div>
                        <div className="card-title">Weight Progress</div>
                        <div className="card-subtitle">Last 7 months</div>
                      </div>
                      <span className="badge badge-purple">-6 kg 🎉</span>
                    </div>
                    <div className="chart-wrap">
                      <WeightLineChart />
                    </div>
                  </div>

                  {/* Workout type breakdown */}
                  <div className="chart-card">
                    <div className="card-header" style={{marginBottom:16}}>
                      <div className="card-title">Workout Breakdown</div>
                    </div>
                    {typeBreakdown.length === 0 ? (
                      <div className="empty-state">
                        <div className="empty-icon">📊</div>
                        <div className="empty-title">No data yet</div>
                        <div className="empty-desc">Log workouts to see breakdown</div>
                      </div>
                    ) : (
                      <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:8}}>
                        {typeBreakdown.map(t => (
                          <div key={t.key}>
                            <div className="progress-bar-label">
                              <span>{t.icon} {t.label}</span>
                              <span>{t.count} sessions</span>
                            </div>
                            <div className="progress-bar">
                              <div className="progress-bar-fill" style={{
                                width:`${(t.count/totalWorkouts*100)}%`,
                                background: t.key==='cardio'?'var(--accent-orange)':t.key==='strength'?'var(--accent-blue)':t.key==='yoga'?'var(--accent-purple)':t.key==='hiit'?'var(--accent-red)':'var(--accent-teal)'
                              }} />
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Weekly workout volume */}
                  <div className="chart-card">
                    <div className="card-header" style={{marginBottom:16}}>
                      <div className="card-title">Weekly Calorie Burn</div>
                    </div>
                    <div className="chart-wrap">
                      <WeeklyChart workouts={workouts} />
                    </div>
                  </div>

                  {/* Nutrition weekly */}
                  <div className="chart-card">
                    <div className="card-header" style={{marginBottom:16}}>
                      <div className="card-title">Calorie Intake Trend</div>
                    </div>
                    <div className="chart-wrap">
                      <CalorieLineChart meals={meals} />
                    </div>
                  </div>
                </div>
              </>
            )}

            {tab === 'achievements' && (
              <div className="card">
                <div className="card-header">
                  <div>
                    <div className="card-title">Your Achievements</div>
                    <div className="card-subtitle">{ACHIEVEMENTS.filter(a=>a.unlocked).length} / {ACHIEVEMENTS.length} unlocked</div>
                  </div>
                </div>
                <div className="achievement-grid">
                  {ACHIEVEMENTS.map(a => (
                    <div key={a.id} className={`achievement-card ${a.unlocked ? 'unlocked' : ''}`}>
                      <span className={`achievement-icon ${a.unlocked ? '' : 'locked-overlay'}`}>{a.icon}</span>
                      <div className="achievement-name">{a.name}</div>
                      <div className="achievement-desc">{a.desc}</div>
                      {a.unlocked && <span className="badge badge-green" style={{marginTop:8}}>Unlocked ✓</span>}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'challenges' && (
              <div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
                  <div>
                    <div className="card-title">Active Challenges</div>
                    <div style={{fontSize:13,color:'var(--text-muted)',marginTop:4}}>Push yourself further with these fitness challenges</div>
                  </div>
                </div>
                <div className="challenge-list">
                  {CHALLENGES.map(c => (
                    <div key={c.id} className="challenge-card">
                      <div className="challenge-header">
                        <span className="challenge-icon">{c.icon}</span>
                        <div>
                          <div className="challenge-title">{c.title}</div>
                          <div className="challenge-subtitle">{c.subtitle}</div>
                        </div>
                        <div className="challenge-reward">{c.reward}</div>
                      </div>
                      <div className="progress-bar-label">
                        <span style={{fontSize:12,color:'var(--text-secondary)'}}>Day {c.progress} of {c.total}</span>
                        <span style={{fontSize:12,fontWeight:700,color:'var(--accent-lime)'}}>{Math.round(c.progress/c.total*100)}%</span>
                      </div>
                      <div className="progress-bar" style={{height:8}}>
                        <div className="progress-bar-fill" style={{
                          width:`${c.progress/c.total*100}%`,
                          background: c.color==='orange'?'var(--accent-orange)':c.color==='blue'?'var(--accent-blue)':'var(--accent-purple)'
                        }} />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'ai' && (
              <div>
                <div className="card" style={{marginBottom:20}}>
                  <div className="card-header">
                    <div>
                      <div className="card-title">🤖 AI Coach Insights</div>
                      <div className="card-subtitle">Personalized recommendations based on your training data</div>
                    </div>
                    <span className="ai-badge">✨ Powered by AI</span>
                  </div>

                  <div style={{background:'var(--accent-lime-dim)',border:'1px solid var(--accent-lime)',borderRadius:'var(--radius-md)',padding:'16px',marginBottom:16}}>
                    <div style={{fontSize:13,fontWeight:700,color:'var(--text-accent)',marginBottom:6}}>📈 Weekly Analysis</div>
                    <div style={{fontSize:13,color:'var(--text-secondary)',lineHeight:1.6}}>
                      Great week! You've completed <strong style={{color:'var(--text-primary)'}}>5 workouts</strong> and burned <strong style={{color:'var(--text-primary)'}}>2,340 kcal</strong>. Your consistency is in the <strong style={{color:'var(--accent-lime)'}}>top 15%</strong> of FitTrack users this week.
                    </div>
                  </div>

                  <div className="ai-suggestions">
                    {AI_SUGGESTIONS.map((s, i) => (
                      <div key={i} className="ai-suggestion-card">
                        <div className="ai-icon">{s.icon}</div>
                        <div className="ai-suggestion-text">
                          <h4>{s.title}</h4>
                          <p>{s.desc}</p>
                        </div>
                        <button className="btn btn-ghost btn-sm" style={{flexShrink:0}}>Try it →</button>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="card">
                  <div className="card-header">
                    <div className="card-title">🗓️ Suggested This Week</div>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:8}}>
                    {[
                      {day:'Mon',workout:'Upper Body Strength',dur:45,cal:280,type:'strength'},
                      {day:'Tue',workout:'5K Easy Run',dur:30,cal:310,type:'cardio'},
                      {day:'Wed',workout:'Rest & Stretch',dur:20,cal:60,type:'yoga'},
                      {day:'Thu',workout:'HIIT Circuit',dur:25,cal:350,type:'hiit'},
                      {day:'Fri',workout:'Lower Body Strength',dur:50,cal:300,type:'strength'},
                      {day:'Sat',workout:'Long Run / Hike',dur:60,cal:480,type:'cardio'},
                      {day:'Sun',workout:'Active Recovery',dur:30,cal:100,type:'yoga'},
                    ].map((w,i) => {
                      const ti = WORKOUT_TYPES.find(t => t.key === w.type);
                      return (
                        <div key={i} className="activity-item">
                          <div style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--text-muted)',width:32,flexShrink:0}}>{w.day}</div>
                          <div className={`activity-icon icon-bg-${ti.color}`}>{ti.icon}</div>
                          <div className="activity-info">
                            <div className="activity-name">{w.workout}</div>
                            <div className="activity-time">{w.dur} min · {w.cal} kcal</div>
                          </div>
                          <span className={`tag tag-${w.type}`}>{ti.label}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ============================================
       AUTH PAGE
    ============================================ */
    function AuthPage({ setUser, setPage, addToast }) {
      const [tab, setTab] = useState('login');
      const [form, setForm] = useState({ name: '', email: '', password: '', confirm: '' });
      const [loading, setLoading] = useState(false);

      const handleSubmit = () => {
        if (tab === 'register') {
          if (!form.name || !form.email || !form.password) {
            addToast('error', 'Missing fields', 'Please fill in all required fields.'); return;
          }
          if (form.password !== form.confirm) {
            addToast('error', 'Passwords do not match', 'Please re-enter your password.'); return;
          }
        } else {
          if (!form.email || !form.password) {
            addToast('error', 'Missing fields', 'Please enter your email and password.'); return;
          }
        }

        setLoading(true);
        setTimeout(() => {
          setLoading(false);
          const user = { name: form.name || form.email.split('@')[0], email: form.email };
          setUser(user);
          addToast('success', `Welcome${tab==='register'?' to FitTrack Pro':' back'}, ${user.name}! 🎉`, tab==='register' ? 'Your account is ready.' : 'Let\'s crush it today!');
          setPage('Dashboard');
        }, 1200);
      };

      return (
        <div className="page">
          <div className="auth-page">
            <div className="auth-bg-text">FIT</div>
            <div className="auth-card">
              <div className="auth-logo">
                <div style={{display:'flex',alignItems:'center',gap:8,justifyContent:'center'}}>
                  <div className="logo-icon" style={{width:40,height:40,fontSize:20}}>⚡</div>
                  <span className="logo-text" style={{fontSize:24}}>FIT<span>TRACK</span></span>
                </div>
              </div>

              <h2 className="auth-title">{tab === 'login' ? 'Welcome back' : 'Create account'}</h2>
              <p className="auth-subtitle">{tab === 'login' ? 'Sign in to continue your fitness journey' : 'Join 50,000+ athletes on FitTrack Pro'}</p>

              <div className="auth-tabs">
                <button className={`auth-tab ${tab==='login'?'active':''}`} onClick={() => setTab('login')}>Sign In</button>
                <button className={`auth-tab ${tab==='register'?'active':''}`} onClick={() => setTab('register')}>Register</button>
              </div>

              {/* Social login */}
              <button className="social-btn">
                <span>🌐</span> Continue with Google
              </button>

              <div className="auth-divider">or continue with email</div>

              {tab === 'register' && (
                <div className="form-group">
                  <label className="form-label">Full Name</label>
                  <input className="form-control" placeholder="Alex Johnson"
                    value={form.name} onChange={e => setForm(f=>({...f,name:e.target.value}))} />
                </div>
              )}

              <div className="form-group">
                <label className="form-label">Email Address</label>
                <input className="form-control" type="email" placeholder="alex@example.com"
                  value={form.email} onChange={e => setForm(f=>({...f,email:e.target.value}))} />
              </div>

              <div className="form-group">
                <label className="form-label">Password</label>
                <input className="form-control" type="password" placeholder="••••••••"
                  value={form.password} onChange={e => setForm(f=>({...f,password:e.target.value}))} />
              </div>

              {tab === 'register' && (
                <div className="form-group">
                  <label className="form-label">Confirm Password</label>
                  <input className="form-control" type="password" placeholder="••••••••"
                    value={form.confirm} onChange={e => setForm(f=>({...f,confirm:e.target.value}))} />
                </div>
              )}

              {tab === 'login' && (
                <div style={{textAlign:'right',marginBottom:16}}>
                  <span style={{fontSize:13,color:'var(--accent-lime)',cursor:'pointer',fontWeight:500}}>Forgot password?</span>
                </div>
              )}

              <button className="btn btn-primary w-full btn-lg" onClick={handleSubmit} disabled={loading}>
                {loading ? (
                  <span>Loading <span className="loading-dot"></span></span>
                ) : (
                  tab === 'login' ? '→ Sign In' : '→ Create Account'
                )}
              </button>

              {tab === 'register' && (
                <div style={{fontSize:12,color:'var(--text-muted)',textAlign:'center',marginTop:14,lineHeight:1.6}}>
                  By creating an account, you agree to our <span style={{color:'var(--accent-lime)',cursor:'pointer'}}>Terms of Service</span> and <span style={{color:'var(--accent-lime)',cursor:'pointer'}}>Privacy Policy</span>.
                </div>
              )}

              <div className="auth-footer">
                {tab === 'login' ? "Don't have an account? " : "Already have an account? "}
                <a onClick={() => setTab(tab === 'login' ? 'register' : 'login')}>
                  {tab === 'login' ? 'Sign up free' : 'Sign in'}
                </a>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ============================================
       SEED DATA
    ============================================ */
    const SEED_WORKOUTS = [
      { id: 1, name: 'Morning Run', type: 'cardio', duration: '35', calories: '340', notes: 'Felt great today!', date: new Date().toISOString().split('T')[0] },
      { id: 2, name: 'Push Day', type: 'strength', duration: '50', calories: '280', notes: 'New bench PR!', date: new Date(Date.now()-86400000).toISOString().split('T')[0] },
      { id: 3, name: 'HIIT Cardio', type: 'hiit', duration: '25', calories: '380', notes: '', date: new Date(Date.now()-2*86400000).toISOString().split('T')[0] },
      { id: 4, name: 'Yoga Flow', type: 'yoga', duration: '40', calories: '140', notes: 'Great for recovery', date: new Date(Date.now()-3*86400000).toISOString().split('T')[0] },
      { id: 5, name: 'Leg Day', type: 'strength', duration: '55', calories: '320', notes: '', date: new Date(Date.now()-4*86400000).toISOString().split('T')[0] },
    ];

    const SEED_MEALS = [
      { id: 1, name: 'Oats with Banana & Honey', mealType: 'breakfast', calories: '380', protein: '12', carbs: '68', fat: '6', time: '07:30' },
      { id: 2, name: 'Grilled Chicken Bowl', mealType: 'lunch', calories: '520', protein: '45', carbs: '55', fat: '10', time: '12:15' },
      { id: 3, name: 'Greek Yogurt & Almonds', mealType: 'snack', calories: '210', protein: '14', carbs: '18', fat: '9', time: '15:30' },
      { id: 4, name: 'Salmon with Vegetables', mealType: 'dinner', calories: '480', protein: '38', carbs: '30', fat: '18', time: '19:00' },
    ];

    /* ============================================
       ROOT APP
    ============================================ */
    function App() {
      const [page, setPage] = useState('Home');
      const [theme, setTheme] = useLocalStorage('theme', 'dark');
      const [user, setUser] = useLocalStorage('user', null);
      const [workouts, setWorkouts] = useLocalStorage('workouts', SEED_WORKOUTS);
      const [meals, setMeals] = useLocalStorage('meals', SEED_MEALS);
      const { toasts, add: addToast, remove } = useToasts();

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
      }, [theme]);

      const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');

      const goTo = (p) => {
        if (['Dashboard','Workouts','Nutrition','Progress'].includes(p) && !user) {
          setPage('Auth');
        } else {
          setPage(p);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const renderPage = () => {
        switch(page) {
          case 'Home': return <HomePage setPage={goTo} user={user} />;
          case 'Dashboard': return <DashboardPage workouts={workouts} meals={meals} user={user} addToast={addToast} setPage={goTo} />;
          case 'Workouts': return <WorkoutsPage workouts={workouts} setWorkouts={setWorkouts} addToast={addToast} />;
          case 'Nutrition': return <NutritionPage meals={meals} setMeals={setMeals} addToast={addToast} />;
          case 'Progress': return <ProgressPage workouts={workouts} meals={meals} />;
          case 'Auth': return <AuthPage setUser={setUser} setPage={goTo} addToast={addToast} />;
          default: return <HomePage setPage={goTo} user={user} />;
        }
      };

      return (
        <>
          <Navbar
            page={page}
            setPage={goTo}
            theme={theme}
            toggleTheme={toggleTheme}
            user={user}
            setUser={setUser}
          />
          {renderPage()}
          <ToastContainer toasts={toasts} remove={remove} />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
